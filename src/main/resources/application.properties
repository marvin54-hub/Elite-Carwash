# ══════════════════════════════════════════════════════════════
# Witbank Elite Car Wash — Application Configuration
# ══════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────

server.port=${PORT:8080}
server.servlet.session.timeout=60m


# ── Database ──────────────────────────────────────────────────
# Default to local H2 file database; overridden by DATABASE_URL / DB_* environment variables for PostgreSQL in production.

spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/carwashdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ── Booking Capacity ──────────────────────────────────────────

carwash.bays=${BAYS:2}


# ── Base URL ──────────────────────────────────────────────────
# Used for Yoco redirects.

carwash.base-url=${BASE_URL:http://localhost:8080}


# ── Yoco Payment Gateway ──────────────────────────────────────

yoco.secret-key=${YOCO_SECRET_KEY:}
yoco.webhook-secret=${YOCO_WEBHOOK_SECRET:}


# ── OpenWeatherMap ────────────────────────────────────────────

openweather.api-key=${OPENWEATHER_API_KEY:}
openweather.city=${OPENWEATHER_CITY:Witbank,ZA}


# ── H2 Console ────────────────────────────────────────────────
# Disabled because production uses PostgreSQL.

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false