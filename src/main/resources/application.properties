# ══════════════════════════════════════════════════════════════
#  Witbank Elite Car Wash — Application Configuration
#  All sensitive values read from environment variables so this
#  file can be committed to GitHub safely.
# ══════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.session.timeout=60m

# ── Database ──────────────────────────────────────────────────
# LOCAL DEV  → H2 file-based (data persists in ./data/)
# PRODUCTION → set DATABASE_URL env var to a PostgreSQL URL
#              e.g. jdbc:postgresql://host:5432/dbname
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/carwashdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Booking Capacity ──────────────────────────────────────────
carwash.bays=${BAYS:2}

# ── Base URL (used for Yoco redirects) ───────────────────────
carwash.base-url=${BASE_URL:http://localhost:8080}

# ── Yoco Payment Gateway ──────────────────────────────────────
yoco.secret-key=${YOCO_SECRET_KEY:}
yoco.webhook-secret=${YOCO_WEBHOOK_SECRET:}

# ── OpenWeatherMap ────────────────────────────────────────────
openweather.api-key=${OPENWEATHER_API_KEY:}
openweather.city=${OPENWEATHER_CITY:Witbank,ZA}

# ── H2 Console (dev only, never enable on production) ────────
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
