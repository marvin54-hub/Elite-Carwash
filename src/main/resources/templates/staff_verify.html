<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Booking | Witbank Elite</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .verify-card {
            width: 100%; max-width: 480px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 40px 36px;
            backdrop-filter: blur(20px);
        }
        .verify-card h1 { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
        .verify-card h1 span { color: #00d2ff; }
        .verify-sub { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 28px; }
        .verify-field input {
            width: 100%; padding: 14px 16px; box-sizing: border-box;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: white; font-family: 'Outfit', sans-serif; font-size: 1.1rem;
            text-align: center; letter-spacing: 1px; text-transform: uppercase;
        }
        .verify-btn {
            width: 100%; padding: 14px; margin-top: 12px;
            background: linear-gradient(135deg, #00d2ff, #0099bb);
            border: none; border-radius: 10px; color: #000;
            font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        .result-box {
            margin-top: 26px; padding: 20px; border-radius: 14px;
            background: rgba(0,255,150,0.07); border: 1px solid rgba(0,255,150,0.25);
        }
        .result-row { display:flex; justify-content:space-between; padding:6px 0; font-size:0.88rem; }
        .result-row span:first-child { color: rgba(255,255,255,0.5); }
        .not-found {
            margin-top: 26px; padding: 16px; border-radius: 10px; text-align:center;
            background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3); color:#ff8080;
        }
        .verified-badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:0.75rem; font-weight:700;
            background: rgba(0,255,150,0.15); color:#4dffaa; margin-top:10px; }
        .confirm-btn {
            width: 100%; padding: 12px; margin-top: 16px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: white; font-family: 'Outfit', sans-serif; font-weight: 700; cursor: pointer;
        }
        .back-link { text-align: center; margin-top: 22px; font-size: 0.82rem; }
        .back-link a { color: rgba(255,255,255,0.4); text-decoration: none; }
        .back-link a:hover { color: #00d2ff; }
    </style>
</head>
<body>
<div class="verify-card">
    <h1>WITBANK <span>ELITE</span></h1>
    <p class="verify-sub">🔎 Booking Verification — scan the QR or type the reference</p>

    <form action="/admin/verify" method="GET" class="verify-field">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="text" name="code" placeholder="e.g. WE-12" autofocus>
        <button type="submit" class="verify-btn">Verify Booking →</button>
    </form>

    <div th:if="${found != null}" class="result-box">
        <div class="result-row"><span>Reference</span><span th:text="${'#WE-' + found.id}"></span></div>
        <div class="result-row"><span>Customer</span><span th:text="${found.customerName}"></span></div>
        <div class="result-row"><span>Service</span><span th:text="${found.serviceType}"></span></div>
        <div class="result-row"><span>Date &amp; Time</span><span th:text="${#temporals.format(found.bookingTime, 'dd MMM yyyy, HH:mm')}"></span></div>
        <div class="result-row"><span>Status</span><span th:text="${found.status}"></span></div>
        <div class="result-row"><span>Payment</span><span th:text="${found.paid ? 'Paid' : 'Unpaid'}"></span></div>

        <div th:if="${found.verified}" style="text-align:center;">
            <span class="verified-badge">✓ Already Verified</span>
        </div>
        <form th:unless="${found.verified}" action="/admin/verify/confirm" method="POST">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="id" th:value="${found.id}">
            <button type="submit" class="confirm-btn">✅ Confirm Arrival</button>
        </form>
    </div>

    <div th:if="${notFound}" class="not-found">
        ⚠️ No booking found for that reference. Double-check the code and try again.
    </div>

    <div class="back-link"><a href="/admin/dashboard">← Back to Dashboard</a></div>
</div>
</body>
</html>
