<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Witbank Elite</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .card { width:100%; max-width:420px; background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:45px 40px;
            backdrop-filter:blur(20px); }
        .logo { text-align:center; margin-bottom:30px; }
        .logo h1 { font-size:1.7rem; font-weight:800; letter-spacing:2px; }
        .logo h1 span { color:#00d2ff; }
        .logo p { color:rgba(255,255,255,0.45); font-size:0.83rem; margin-top:4px; }
        .field { margin-bottom:16px; }
        .field label { display:block; font-size:0.73rem; text-transform:uppercase;
            letter-spacing:1px; color:rgba(255,255,255,0.5); margin-bottom:6px; }
        .field input { width:100%; padding:12px 15px;
            background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
            border-radius:10px; color:white; font-family:'Outfit',sans-serif;
            font-size:0.95rem; box-sizing:border-box; }
        .field input:focus { outline:none; border-color:#00d2ff; }
        .btn { width:100%; padding:13px; background:linear-gradient(135deg,#00d2ff,#0099bb);
            border:none; border-radius:10px; color:#000; font-family:'Outfit',sans-serif;
            font-size:1rem; font-weight:700; cursor:pointer; margin-top:6px; transition:0.3s; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,210,255,0.3); }
        .alert { padding:11px 15px; border-radius:10px; font-size:0.86rem;
            margin-bottom:18px; text-align:center; }
        .alert-error   { background:rgba(255,77,77,0.1);  border:1px solid rgba(255,77,77,0.25);  color:#ff6b6b; }
        .alert-success { background:rgba(77,255,77,0.08); border:1px solid rgba(77,255,77,0.2);   color:#4dff4d; }
        .links { text-align:center; margin-top:20px; font-size:0.82rem; color:rgba(255,255,255,0.4); }
        .links a { color:#00d2ff; text-decoration:none; }
        hr { border:none; border-top:1px solid rgba(255,255,255,0.07); margin:22px 0; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>WITBANK <span>ELITE</span></h1>
        <p>Customer Portal</p>
    </div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <form action="/customer/login" method="POST">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="field"><label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required autofocus></div>
        <div class="field"><label>Password</label>
            <input type="password" name="password" placeholder="Your password" required></div>
        <button type="submit" class="btn">Sign In →</button>
    </form>
    <hr>
    <div class="links">
        No account? <a href="/customer/register">Create one free</a><br><br>
        <a href="/">← Back to Website</a>
    </div>
</div>
</body>
</html>
